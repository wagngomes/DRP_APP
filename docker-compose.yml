# Ambiente completo do DRP_AI: `docker compose up` sobe tudo que a aplicação
# precisa para funcionar, sem nenhum passo manual antes.
#
# A ordem é garantida por condição, não por espera: o banco precisa estar
# saudável antes das migrations, e as migrations precisam ter terminado com
# sucesso antes da aplicação subir. Sem isso a aplicação sobe contra um schema
# que ainda não existe e falha na primeira consulta.
#
# Prometheus e Grafana ficam no perfil `observabilidade`, fora do `up` padrão:
# quem quer só rodar o sistema não deve carregar dois serviços a mais.
#   docker compose up                              → banco, aplicação e vigia
#   docker compose --profile observabilidade up    → tudo, com painel
#
# ---------------------------------------------------------------------------
# Dimensionamento
# ---------------------------------------------------------------------------
# Os limites abaixo foram calculados para uma VPS de 2 vCPU e 8 GB, com até 15
# usuários — e a partir de medições do banco real, não de estimativas:
#
#   banco inteiro        467 MB, crescendo ~5,6 MB por dia útil (~1,4 GB/ano)
#   maior carga          historico_vendas: 187,5 MB brutos, 512.069 linhas
#   latência atual       141ms por ida e volta ao Supabase em us-east-2
#
# Aquele último número é o motivo de tudo isto valer a pena: uma consulta real
# leva 144ms, dos quais 141ms são rede e 3ms são banco. Com o Postgres nesta
# mesma máquina a latência cai para frações de milissegundo, e as telas ficam
# mais rápidas do que na nuvem — apesar dos 2 vCPU.
#
# A divisão da memória parte de onde está o risco. Não é a navegação: o banco
# inteiro cabe em cache e o Node em regime usa ~300 MB. É a **importação de
# CSV**, que mantém o arquivo na memória três vezes ao mesmo tempo — bytes
# crus, texto decodificado e objetos parseados. Sobre os 187,5 MB da maior
# base, isso dá algo como 180 MB de buffer + ~360 MB de string + ~600 MB de
# objetos: pico na casa de 1,5 GB contando folga de coleta. Já derrubou este
# sistema por falta de heap uma vez.
#
# Daí o heap declarado explicitamente em 2,5 GB. Sem limite dito, o Node
# dimensiona sozinho pelo total da máquina e avança sobre o que o banco
# precisa. E `IMPORTACAO_SIMULTANEA = 1`, no código, é o que garante que esse
# pico aconteça uma vez por vez.
#
# Orçamento de 8 GB, com os tetos abaixo:
#
#   host + Docker        ~800 MB
#   banco                   2 GB   (uso típico ~1,4 GB)
#   aplicação               5 GB   (uso típico ~300 MB; o teto é para a carga)
#   backup                256 MB   (dorme quase o tempo todo)
#   vigia                  64 MB
#   observabilidade       768 MB   (só no perfil, fora do `up` padrão)
#
# A soma dos tetos passa dos 7,8 GB da máquina, e isso é deliberado: são tetos,
# não reservas. Em regime a aplicação usa ~300 MB, e os 5 GB só são tocados
# durante uma importação grande — quando backup e vigia somam menos de 50 MB e o
# banco está nos seus 1,4 GB. O pior caso real fica em torno de 6,7 GB, com os
# 2 GB de swap como rede se a conta escapar.
#
# São tetos, não reservas: os contêineres usam o que precisam. O teto existe
# para que uma importação grande não mate o banco por OOM — e vice-versa.
#
# Vale criar 2 GB de swap no host. Em operação normal nunca será tocado; existe
# para a importação grande degradar em vez de morrer.

services:
  banco:
    image: postgres:17-alpine
    restart: unless-stopped
    labels:
      autoheal: "true"
    # 768 MB de cache para 467 MB de dados: o banco inteiro fica em memória, com
    # 60% de folga para crescer. Passar disso não compraria nada — o que não
    # cabe em 768 MB também não existe.
    #
    # `effective_cache_size` não reserva memória: só informa ao planner quanta
    # existe. Sem isso ele subestima o cache e escolhe varredura sequencial onde
    # o índice seria melhor.
    #
    # `max_connections=30` porque o pool do Prisma abre `vCPUs × 2 + 1` — cinco
    # conexões nesta máquina. Trinta cobre a aplicação, as migrations e um psql
    # aberto para inspeção, com folga. O teto importa porque `work_mem` é por
    # operação de ordenação: 30 × 24 MB no pior caso são 720 MB, que somados aos
    # 768 MB de cache cabem nos 2 GB do contêiner. Com os 100 conexões e 32 MB
    # do padrão, o pior caso passaria do teto e o banco morreria por OOM
    # justamente sob carga.
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=24MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=30
      # Importação usa COPY em lote: checkpoints mais espaçados evitam que a
      # carga pare para gravar a cada poucos megabytes.
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      # NVMe: acesso aleatório custa quase o mesmo que sequencial. O padrão 4.0
      # é de disco mecânico e empurra o planner para longe dos índices.
      - -c
      - random_page_cost=1.1
    mem_limit: 2g
    # O padrão do Docker para /dev/shm é 64 MB, e o Postgres aloca memória
    # compartilhada dinâmica ali para query paralela. No padrão, uma agregação
    # grande falha com "could not resize shared memory segment" — erro que só
    # aparece sob volume, que é exatamente quando ninguém quer descobri-lo.
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drp_local}
      POSTGRES_DB: ${POSTGRES_DB:-drp_ai}
      # Locale e collation fixados: ordenação de texto que muda entre ambientes
      # produz resultado diferente no mesmo dado.
      LANG: C.UTF-8
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    # `retries` alto de propósito, agora que o vigia age sobre a saúde: são
    # precisos ~100s de falha contínua para o banco ser declarado doente. Numa
    # importação grande, com os dois núcleos ocupados pelo parse e pelo COPY, o
    # `pg_isready` pode demorar a responder — e reiniciar o banco por causa
    # disso mataria justamente a carga que estava em curso. Banco realmente
    # morto continua sendo pego; soluço sob carga, não.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drp} -d ${POSTGRES_DB:-drp_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Sem `ports` de propósito: o banco só é alcançável pela rede interna do
    # compose. Para inspecionar de fora, descomente — e saiba que está expondo.
    # ports: ["5432:5432"]

  migracoes:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drp}:${POSTGRES_PASSWORD:-drp_local}@banco:5432/${POSTGRES_DB:-drp_ai}
    depends_on:
      banco:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    labels:
      autoheal: "true"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-drp}:${POSTGRES_PASSWORD:-drp_local}@banco:5432/${POSTGRES_DB:-drp_ai}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET no .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Heap declarado, e não deixado ao critério do Node: o padrão é calculado
      # sobre a memória total da máquina e ignora que o Postgres também mora
      # aqui.
      #
      # Eram 2,5 GB, dimensionados por uma estimativa de 1,5 GB de pico. A
      # estimativa estava errada: a importação de 166 MB de histórico morreu
      # com `JavaScript heap out of memory`. Um CSV de meio milhão de linhas com
      # 33 colunas vira muito mais objeto do que a soma dos bytes do arquivo
      # sugere — cada campo é uma string com cabeçalho próprio, e são 16 milhões
      # deles.
      #
      # 4 GB é remendo, não conserto. O conserto é a importação deixar de
      # carregar o arquivo inteiro na memória; enquanto isso não acontece, o
      # teto precisa caber o maior arquivo de hoje com folga para o de amanhã.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=4096}
      # Alinha o relógio do contêiner com o da operação.
      #
      # Não conserta a data do sistema — `toISOString()` converte para UTC
      # independente desta variável, e é por isso que o cálculo de "hoje" foi
      # para `hojeNaOperacao()`, no código. O que `TZ` resolve é a leitura: sem
      # ela o log de auditoria registra 00:33 quando aqui são 21:33, e quem
      # investiga um incidente perde tempo convertendo cada carimbo.
      TZ: ${TZ:-America/Sao_Paulo}
    mem_limit: 5g
    # Sem limite de CPU de propósito. São dois serviços e dois vCPUs: em regime,
    # o Node ocupa um núcleo para o JavaScript e o Postgres o outro. Os dois só
    # disputam de verdade durante uma importação — o parse do CSV de um lado, o
    # COPY do outro — e é justamente aí que limitar faria a carga demorar mais
    # sem proteger nada. A tela fica lenta nesse intervalo; é o preço conhecido
    # de 2 vCPU, e vale pagá-lo uma vez por manhã.
    # Escuta só no próprio host, não em 0.0.0.0.
    #
    # Com `"3000:3000"` o Docker abre a porta para a internet inteira, e o
    # proxy reverso na frente vira decoração: qualquer um acessa
    # http://IP-DA-VPS:3000 e conversa direto com a aplicação, sem TLS e sem os
    # limites do nginx. O firewall do sistema também não salva — o Docker
    # escreve as próprias regras no iptables, antes das do ufw.
    #
    # Prefixado com 127.0.0.1, o único que alcança a aplicação é o nginx
    # rodando na mesma máquina.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      banco:
        condition: service_healthy
      migracoes:
        condition: service_completed_successfully
    # Encerramento gracioso: o Node recebe SIGTERM via dumb-init e tem 30s para
    # concluir o que está em curso antes do SIGKILL.
    stop_grace_period: 30s

  backup:
    # Dump diário do banco, com retenção.
    #
    # Mesma imagem do banco, porque `pg_dump` precisa ser da mesma versão do
    # servidor — um dump feito por cliente mais antigo falha ou sai incompleto,
    # e descobrir isso na hora de restaurar é tarde.
    #
    # Não expõe porta, não recebe requisição, não tem healthcheck: é um laço que
    # dorme e acorda. Se o contêiner morrer, `unless-stopped` o traz de volta e
    # o primeiro ciclo roda na subida.
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PGHOST: banco
      PGUSER: ${POSTGRES_USER:-drp}
      PGPASSWORD: ${POSTGRES_PASSWORD:-drp_local}
      PGDATABASE: ${POSTGRES_DB:-drp_ai}
      RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      INTERVALO_SEGUNDOS: ${BACKUP_INTERVALO_SEGUNDOS:-86400}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - dados_backup:/backups
    depends_on:
      banco:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]

  vigia:
    # Reinicia contêiner que ficou `unhealthy`.
    #
    # Existe porque `restart: unless-stopped` só reage ao processo **sair**. Um
    # processo vivo e travado — laço de eventos bloqueado, pool de conexões
    # esgotado, banco respondendo devagar demais — deixa o contêiner marcado
    # como `unhealthy` para sempre, e o Docker sozinho não age sobre isso. Foi
    # exatamente o estado em que este sistema ficou depois de uma importação:
    # processo de pé, nenhuma tela carregando, até alguém perceber.
    #
    # O `HEALTHCHECK` da aplicação consulta /api/health, que verifica o banco de
    # verdade em vez de só confirmar que a porta abriu — então "saudável" aqui
    # significa capaz de atender, não apenas vivo.
    #
    # ATENÇÃO, e é uma escolha consciente: este contêiner recebe o socket do
    # Docker, o que na prática equivale a acesso root ao host. `AUTOHEAL_
    # CONTAINER_LABEL` limita o que ele **faz** — só reinicia quem tem o rótulo
    # `autoheal: "true"` — mas não limita o que ele **poderia** fazer. A
    # alternativa sem essa exposição é um proxy de socket na frente, que é mais
    # uma peça para manter. Num sistema interno de 15 usuários a troca vale;
    # numa máquina com carga de terceiros, não valeria.
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    mem_limit: 64m
    environment:
      # Só quem tem o rótulo. O padrão alternativo ("all") vigiaria qualquer
      # contêiner da máquina, inclusive os que não são deste projeto.
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      # Carência maior que o `start-period` do HEALTHCHECK da aplicação (40s):
      # sem ela, o vigia reiniciaria a app no meio da própria subida.
      AUTOHEAL_START_PERIOD: 120
      # Mesmo prazo do `stop_grace_period` da app, para o reinício respeitar o
      # encerramento gracioso em vez de cortar no meio.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observabilidade"]
    restart: unless-stopped
    mem_limit: 384m
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - dados_prometheus:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["observabilidade"]
    restart: unless-stopped
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Sem telemetria e sem atualização automática: ambiente interno.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      # Provisionamento automático: a fonte de dados e o painel já sobem
      # configurados, sem ninguém clicar na interface.
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - dados_grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  dados_postgres:
  # Volume separado do banco de propósito: backup guardado dentro do volume de
  # dados desaparece junto com ele, que é exatamente o caso contra o qual o
  # backup existe. Ainda assim mora na mesma máquina — cópia para fora do host
  # continua sendo necessária, e está anotada no README-operacao.md.
  dados_backup:
  dados_prometheus:
  dados_grafana:
