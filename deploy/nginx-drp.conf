# Proxy reverso do DRP_AI.
#
# Instalar em /etc/nginx/sites-available/drp e ligar com:
#   ln -s /etc/nginx/sites-available/drp /etc/nginx/sites-enabled/drp
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Trocar SEUDOMINIO.COM.BR nos três lugares antes de subir.
#
# ORDEM IMPORTA: o certificado precisa existir ANTES de instalar este arquivo.
# O bloco 443 declara `listen ssl`, e sem o certificado no lugar o `nginx -t`
# falha com "no ssl_certificate is defined for the listen ... ssl directive".
#
#   1. apt install -y nginx certbot python3-certbot-nginx
#   2. certbot certonly --nginx -d SEUDOMINIO.COM.BR -d www.SEUDOMINIO.COM.BR
#   3. só então copiar este arquivo, trocar o domínio e recarregar
#
# `certonly` obtém o certificado sem deixar o certbot reescrever a configuração
# — é o que preserva os ajustes daqui, em especial os de tamanho de corpo e
# tempo limite, que são o que faz a importação de CSV grande funcionar.
#
# A renovação é automática: o pacote instala um timer do systemd que roda duas
# vezes por dia. Confira com `systemctl list-timers | grep certbot`.

# Redireciona tudo para HTTPS. A exceção é o desafio do certbot, que precisa
# responder em HTTP puro para a renovação funcionar.
server {
    listen 80;
    listen [::]:80;
    server_name SEUDOMINIO.COM.BR www.SEUDOMINIO.COM.BR;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 declarado no próprio `listen`, e não como diretiva `http2 on`.
    #
    # A diretiva separada só existe a partir do nginx 1.25, e o Ubuntu 24.04 —
    # base desta VPS — traz o 1.24, onde ela falha com `unknown directive`. A
    # forma antiga funciona nas duas versões: no 1.25+ ela é considerada
    # obsoleta e emite um aviso, mas continua válida.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SEUDOMINIO.COM.BR www.SEUDOMINIO.COM.BR;

    ssl_certificate     /etc/letsencrypt/live/SEUDOMINIO.COM.BR/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEUDOMINIO.COM.BR/privkey.pem;

    # TLS declarado aqui, e não via `include` dos arquivos do certbot: aqueles
    # só existem quando o certbot roda no modo que reescreve a configuração, e
    # depender deles quebraria o `nginx -t` de quem usa `certonly`.
    #
    # Só TLS 1.2 e 1.3. As versões anteriores têm ataques práticos conhecidos e
    # nenhum navegador em uso hoje precisa delas.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Não anunciar a versão do nginx: tira o servidor das buscas automatizadas
    # por versão vulnerável.
    server_tokens off;

    # ------------------------------------------------------------------------
    # Tamanho do corpo
    #
    # O PADRÃO DO NGINX É 1 MB. Sem esta linha, toda importação de CSV morre com
    # "413 Request Entity Too Large" antes de a aplicação ver o arquivo — e a
    # maior base do sistema tem 162 MB.
    #
    # O valor acompanha TAMANHO_MAXIMO_BYTES em
    # src/app/api/imports/[model]/route.ts. Se um mudar, o outro muda junto:
    # nginx menor que a aplicação recusa carga legítima com um erro que não
    # explica nada; nginx maior deixa o arquivo chegar para ser recusado depois,
    # o que só desperdiça a subida.
    # ------------------------------------------------------------------------
    client_max_body_size 300m;

    # Bufferização do corpo LIGADA — que é o padrão, e aqui é proposital.
    #
    # A tentação é desligar (`proxy_request_buffering off`) para economizar uma
    # escrita em disco. Não compensa, por duas razões:
    #
    # 1. Desligada, o nginx repassa em `chunked`, **sem Content-Length**. A
    #    aplicação usa esse cabeçalho para recusar arquivo grande demais antes
    #    de carregá-lo na memória; sem ele, a checagem barata lê zero, deixa
    #    passar, e o arquivo inteiro entra na memória para só então ser
    #    recusado — exatamente o que a checagem existia para evitar.
    #
    # 2. Ligada, o nginx compara o Content-Length com `client_max_body_size`
    #    **antes de receber um byte do corpo** e responde 413 na hora. O envio
    #    grande demais é cortado no começo, não no fim.
    #
    # O custo é um arquivo temporário de até 300 MB em /var/lib/nginx — irrelevante
    # num disco de 100 GB.

    # Tempo entre dois blocos do corpo, não o tempo total do envio. O padrão de
    # 60s basta para conexão comum, mas numa rede corporativa saturada um
    # arquivo de 162 MB pode ter pausas maiores — e o sintoma seria de novo um
    # "travamento" sem mensagem.
    client_body_timeout 300s;

    # Acima disto o nginx escreve em disco em vez de guardar na memória. 256k é
    # generoso para requisição comum e mantém o upload grande fora da RAM, que
    # nesta máquina é dividida com o banco.
    client_body_buffer_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # --------------------------------------------------------------------
        # Cabeçalhos que a aplicação realmente usa
        #
        # `X-Forwarded-For` é a origem do limitador de taxa. Sem ele, todas as
        # requisições chegam sem IP identificável e caem no mesmo balde: o teto
        # de 90 por minuto passa a valer para a soma de todo mundo, e a equipe
        # inteira toma 429 no meio da manhã.
        #
        # `X-Forwarded-Proto` é como o Better Auth sabe que a conexão é HTTPS.
        # Sem ele o cookie de sessão sai sem a marca `secure`.
        # --------------------------------------------------------------------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Uma importação de 162 mil linhas leva minutos entre o COPY e o
        # ANALYZE. O padrão de 60 s corta a conexão no meio e a tela mostra erro
        # de rede — enquanto a carga continua rodando no servidor, sem ninguém
        # saber se terminou.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Os arquivos estáticos do Next têm hash no nome: nunca mudam de conteúdo
    # sem mudar de nome, então podem ser guardados pelo navegador para sempre.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Métricas do Prometheus não devem ficar públicas: expõem rotas, volume e
    # tempo de resposta. Liberadas só para a própria máquina.
    location /api/metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
